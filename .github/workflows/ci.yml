name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -v ./...
      - name: test
        run: go test -race -count=1 ./...

  release:
    name: cross-compile matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: test
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64  # keep only arm64 for mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out=quick2api-${{ matrix.goos }}-${{ matrix.goarch }}
          [ "$GOOS" = windows ] && out=$out.exe
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "$out" ./cmd/quick2api
      - uses: actions/upload-artifact@v4
        with:
          name: quick2api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: quick2api-*
